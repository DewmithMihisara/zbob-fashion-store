spring:
  datasource:
    url: jdbc:h2:mem:zbob;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER,VALUE,POSITION,SIZE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
app:
  # Generous limits, so tests sharing one application do not block each other. RateLimitApiTest uses low ones.
  rate-limit:
    login-per-ip: 10000
    signup-per-ip: 10000
    reset-per-ip: 10000
    forms-per-ip: 10000
  storage:
    local-dir: target/test-uploads
  jwt:
    secret: test-only-secret-test-only-secret-test-only-secret
  admin:
    email: admin@zbob.test
    password: test-admin-password

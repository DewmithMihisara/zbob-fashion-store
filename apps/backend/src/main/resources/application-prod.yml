spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
server:
  # Cloud Run sits behind Google's front end; without this every request would appear to come from it,
  # and rate limits would count all visitors as one.
  forward-headers-strategy: framework
app:
  storage:
    provider: ${STORAGE_PROVIDER:gcs}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

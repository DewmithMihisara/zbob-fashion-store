name: Admin

on:
  pull_request:
    paths:
      - "apps/admin/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/admin-deploy.yml"
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/admin-deploy.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zbob/admin... lint
      - run: pnpm --filter @zbob/admin... typecheck
      - run: pnpm --filter @zbob/admin... test
      - run: pnpm --filter @zbob/admin build

  deploy:
    # Needs the secrets VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_ADMIN_PROJECT_ID.
    if: github.event_name == 'push' && vars.VERCEL_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

name: Backend

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - "infrastructure/docker/backend.Dockerfile"
      - ".github/workflows/backend-deploy.yml"
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "infrastructure/docker/backend.Dockerfile"
      - ".github/workflows/backend-deploy.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: zbob_test
          MYSQL_ROOT_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests on MySQL
        working-directory: apps/backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/zbob_test
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: ci-only-password
        run: mvn -B verify

  deploy:
    # Needs the repository variable GCP_PROJECT and secret GCP_CREDENTIALS. See docs/deployment-guide.md.
    if: github.event_name == 'push' && vars.GCP_PROJECT != ''
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push image
        run: |
          gcloud auth configure-docker gcr.io --quiet
          docker build -f infrastructure/docker/backend.Dockerfile -t gcr.io/${{ vars.GCP_PROJECT }}/zbob-backend:${{ github.sha }} .
          docker push gcr.io/${{ vars.GCP_PROJECT }}/zbob-backend:${{ github.sha }}
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy zbob-backend \
            --image gcr.io/${{ vars.GCP_PROJECT }}/zbob-backend:${{ github.sha }} \
            --region ${{ vars.GCP_REGION }} --project ${{ vars.GCP_PROJECT }} --platform managed
